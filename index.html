<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bdugrhan — Black Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Fira+Code&display=swap" rel="stylesheet">
<style>
  :root { --bg: #030305; --surface: #0a0a0f; --border: #1a1a24; --text: #fff; --muted: #666; --danger: #ff3333; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; user-select: none; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.4s; padding: 20px; }
  .screen.active { opacity: 1; pointer-events: auto; z-index: 10; }
  
  #welcome-screen { cursor: pointer; }
  .welcome-logo { font-family: 'Space Grotesk', sans-serif; font-size: clamp(3rem, 8vw, 6rem); font-weight: 700; letter-spacing: -3px; margin-bottom: 10px; }
  .welcome-sub { color: var(--muted); font-size: 0.85rem; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 50px; }
  .welcome-hint { font-size: 0.9rem; color: #fff; padding: 10px 24px; border: 1px solid var(--border); border-radius: 100px; }

  #auth-screen { background: var(--bg); z-index: 20; }
  .auth-box { width: 100%; max-width: 450px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px; }
  .auth-header { text-align: center; margin-bottom: 30px; }
  .auth-header h2 { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; margin-bottom: 10px; }
  .auth-header p { color: var(--muted); font-size: 0.85rem; }
  .input-group { margin-bottom: 20px; }
  .input-group label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .input-group input { width: 100%; padding: 15px; background: #000; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-family: 'Fira Code', monospace; font-size: 1rem; outline: none; }
  .input-group input:focus { border-color: #444; }
  .submit-btn { width: 100%; padding: 15px; background: var(--text); color: var(--bg); border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; }
  .submit-btn:hover { background: #ccc; }
  .error-msg { color: var(--danger); font-size: 0.85rem; text-align: center; margin-bottom: 15px; min-height: 20px; }

  #app-screen { display: block; padding: 40px 5vw; overflow-y: auto; align-items: flex-start; justify-content: flex-start; }
  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; flex-wrap: wrap; gap: 20px; }
  .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .logo-dot { width: 8px; height: 8px; background: var(--text); border-radius: 50%; }
  .btn-lock { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.9rem; }
  .btn-lock:hover { background: var(--surface); }

  .dropzone { border: 1px dashed var(--border); border-radius: 12px; padding: 40px 20px; text-align: center; background: var(--surface); cursor: pointer; margin-bottom: 30px; }
  .dropzone:hover { border-color: #444; }
  .dropzone h3 { font-size: 1rem; margin-bottom: 8px; font-weight: 500; }
  .dropzone p { color: var(--muted); font-size: 0.85rem; }
  .dropzone input { display: none; }

  #file-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
  .file-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; }
  .file-icon-badge { width: 35px; height: 35px; border-radius: 6px; background: #1a1a24; color: var(--muted); display: flex; justify-content: center; align-items: center; font-family: 'Fira Code', monospace; font-weight: 600; font-size: 0.7rem; margin-bottom: 15px; }
  .file-name { font-weight: 500; font-size: 0.95rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-size { color: var(--muted); font-size: 0.8rem; margin-bottom: 20px; }
  .file-actions { display: flex; gap: 8px; margin-top: auto; }
  .file-actions button { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 0.75rem; cursor: pointer; }
  .file-actions button:hover { background: #1a1a24; }
  .btn-delete:hover { color: var(--danger); border-color: var(--danger); }

  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--text); color: var(--bg); padding: 12px 24px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; opacity: 0; transition: 0.3s; z-index: 10000; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.error { background: var(--danger); color: #fff; }

  #preview-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: none; justify-content: center; align-items: center; padding: 20px; }
  #preview-modal.active { display: flex; }
  .preview-content { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 900px; height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
  .preview-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .btn-back { background: transparent; border: 1px solid var(--border); color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
  .preview-body { padding: 20px; overflow-y: auto; flex: 1; background: #000; }
  .preview-body pre { font-family: 'Fira Code', monospace; font-size: 0.9rem; color: #ccc; white-space: pre-wrap; }
  .preview-body img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; margin: auto; }
</style>
</head>
<body>

<div class="screen active" id="welcome-screen" onclick="goToAuth()">
  <div class="welcome-logo">Bdugrhan</div>
  <div class="welcome-sub">Black Vault</div>
  <div class="welcome-hint">Askeri Düzey Erişim</div>
</div>

<div class="screen" id="auth-screen">
  <div class="auth-box">
    <div class="auth-header">
      <h2>Gizli Erişim</h2>
      <p>Erişim için yetkili kodu girin.</p>
    </div>
    <div class="error-msg" id="error-msg"></div>
    <div class="input-group">
      <label>Erişim Kodu</label>
      <input type="password" id="auth-code" placeholder="••••••••••••••••" autocomplete="off" onkeypress="handleEnter(event)">
    </div>
    <button class="submit-btn" id="submit-btn" onclick="verifyAuth()">Kilidi Aç</button>
  </div>
</div>

<div class="screen" id="app-screen">
  <header>
    <div class="logo">Bdugrhan <div class="logo-dot"></div></div>
    <button class="btn-lock" onclick="lockSystem()">Sistemi Kilitle</button>
  </header>

  <div id="library-section" style="width:100%;">
    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" multiple>
      <h3>Dosyaları sürükle veya tıkla</h3>
      <p>XOR + AES-256 Çift Katmanlı Şifreleme</p>
    </div>
    <div id="file-list"></div>
  </div>
</div>

<div id="toast"></div>

<div id="preview-modal">
  <div class="preview-content">
    <div class="preview-header">
      <h3 id="preview-title">Dosya Adı</h3>
      <button class="btn-back" onclick="closePreview()">← Geri Dön</button>
    </div>
    <div class="preview-body" id="preview-body"></div>
  </div>
</div>

<script>
  // ============================================
  // ⚠️ SİSTEM AYARLARI (GİZLENMİŞ DEĞİŞKENLER)
  // ============================================
  const _0xG1 = "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"; // Token
  const _0xU1 = "KULLANICI_ADIN"; // GitHub Kullanıcı Adın (Bunu doldur)
  const _0xR1 = "REPO_ADIN";     // GitHub Repo Adın (Bunu doldur)
  const _0xP1 = "SENIN_SIFREN";  // Giriş Şifren (Bunu doldur)
  const _0xF1 = "vault_files";   // Dosyaların tutulacağı klasör

  // ============================================
  // 1. XOR KATMANI (Gizli Anahtar)
  // ============================================
  const _0xX1 = new Uint8Array([0x42, 0x64, 0x75, 0x67, 0x72, 0x68, 0x61, 0x6E, 0x21, 0x32, 0x37, 0x35, 0x38]);
  
  function _0xX0R(data, key) {
    let result = new Uint8Array(data.length);
    for (let i = 0; i < data.length; i++) {
      result[i] = data[i] ^ key[i % key.length];
    }
    return result;
  }

  // ============================================
  // 2. AES-256-GCM KATMANI (Askeri Düzey)
  // ============================================
  async function _0xD3R(password) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits", "deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: enc.encode("black_vault_salt_v99"), iterations: 200000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false, ["encrypt", "decrypt"]
    );
  }

  async function _0xE1(data, key) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, data);
    return { iv, ciphertext };
  }

  async function _0xD1(ciphertext, iv, key) {
    return await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
  }

  // ============================================
  // 3. GITHUB API FONKSİYONLARI
  // ============================================
  async function _0xGH_UP(filename, base64Content) {
    const path = `${_0xF1}/${filename}`;
    const url = `https://api.github.com/repos/${_0xU1}/${_0xR1}/contents/${path}`;
    
    let sha = null;
    try {
      const check = await fetch(url, { headers: { "Authorization": `Bearer ${_0xG1}` } });
      if (check.ok) { const d = await check.json(); sha = d.sha; }
    } catch(e) {}

    const body = { message: `Upload ${filename}`, content: base64Content, branch: "main" };
    if (sha) body.sha = sha;

    const res = await fetch(url, {
      method: "PUT",
      headers: { "Authorization": `Bearer ${_0xG1}`, "Accept": "application/vnd.github.v3+json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error("GitHub yükleme hatası");
  }

  async function _0xGH_LIST() {
    const url = `https://api.github.com/repos/${_0xU1}/${_0xR1}/contents/${_0xF1}`;
    const res = await fetch(url, { headers: { "Authorization": `Bearer ${_0xG1}` } });
    if (!res.ok) { if (res.status === 404) return []; throw new Error("Liste alınamadı"); }
    return await res.json();
  }

  async function _0xGH_DEL(filename, sha) {
    const url = `https://api.github.com/repos/${_0xU1}/${_0xR1}/contents/${_0xF1}/${filename}`;
    const res = await fetch(url, {
      method: "DELETE",
      headers: { "Authorization": `Bearer ${_0xG1}`, "Accept": "application/vnd.github.v3+json" },
      body: JSON.stringify({ message: `Delete ${filename}`, sha: sha, branch: "main" })
    });
    if (!res.ok) throw new Error("Silme başarısız");
  }

  // ============================================
  // YARDIMCILAR
  // ============================================
  let _0xMK = null; // Master Key
  let _0xCUR = [];  // Current Files

  function showToast(msg, err = false) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.className = err ? 'show error' : 'show';
    clearTimeout(window.tt);
    window.tt = setTimeout(() => t.classList.remove('show'), 3000);
  }

  function _0xB64(buffer) {
    let binary = '';
    const bytes = new Uint8Array(buffer);
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }

  function _0xU64(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  // ============================================
  // EKRAN GEÇİŞLERİ
  // ============================================
  window.goToAuth = function() {
    document.getElementById('welcome-screen').classList.remove('active');
    document.getElementById('auth-screen').classList.add('active');
    setTimeout(() => document.getElementById('auth-code').focus(), 100);
  };

  window.handleEnter = function(e) { if (e.key === 'Enter') verifyAuth(); };

  window.verifyAuth = async function() {
    const input = document.getElementById('auth-code').value;
    const err = document.getElementById('error-msg');
    const btn = document.getElementById('submit-btn');

    if (input === _0xP1) {
      err.innerText = "";
      btn.disabled = true;
      btn.innerText = "Anahtar Hesaplanıyor...";
      
      try {
        _0xMK = await _0xD3R(input); // AES Anahtarı
        
        document.getElementById('auth-screen').classList.remove('active');
        document.getElementById('app-screen').classList.add('active');
        await loadFiles();
      } catch (e) {
        err.innerText = "Kritik Hata: " + e.message;
        btn.disabled = false;
        btn.innerText = "Kilidi Aç";
      }
    } else {
      err.innerText = "Erişim Reddedildi!";
      document.getElementById('auth-code').value = '';
    }
  };

  window.lockSystem = function() {
    _0xMK = null;
    document.getElementById('app-screen').classList.remove('active');
    document.getElementById('welcome-screen').classList.add('active');
    document.getElementById('auth-code').value = '';
    document.getElementById('file-list').innerHTML = '';
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('submit-btn').innerText = "Kilidi Aç";
  };

  // ============================================
  // DOSYA YÜKLEME
  // ============================================
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('file-list');

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = "#fff"; });
  dropzone.addEventListener('dragleave', () => dropzone.style.borderColor = "");
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault(); dropzone.style.borderColor = "";
    if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) handleFiles(e.target.files);
    fileInput.value = '';
  });

  async function handleFiles(filesArray) {
    if (!_0xMK) return showToast("Önce giriş yap!", true);
    const files = Array.from(filesArray);
    
    for (const file of files) {
      try {
        // 1. Dosyayı oku
        const buffer = await file.arrayBuffer();
        
        // 2. XOR Katmanı (Gizli Anahtar)
        const xorBuffer = _0xX0R(new Uint8Array(buffer), _0xX1);
        
        // 3. AES-256 Katmanı (Askeri Şifreleme)
        const { iv, ciphertext } = await _0xE1(xorBuffer, _0xMK);
        
        // 4. IV + Şifreli Veri Birleştir
        const combined = new Uint8Array(iv.length + ciphertext.byteLength);
        combined.set(iv, 0);
        combined.set(new Uint8Array(ciphertext), iv.length);
        
        // 5. Base64 ve GitHub'a Yükle
        const b64 = _0xB64(combined.buffer);
        const uniqueName = `${Date.now()}_${file.name}.enc`;
        
        await _0xGH_UP(uniqueName, b64);
        showToast(`${file.name} şifrelenip GitHub'a yüklendi.`);
      } catch (e) {
        showToast(`${file.name} yüklenemedi!`, true);
      }
    }
    await loadFiles();
  }

  // ============================================
  // DOSYA LİSTELEME
  // ============================================
  async function loadFiles() {
    if (!_0xMK) return;
    try {
      const ghFiles = await _0xGH_LIST();
      _0xCUR = ghFiles.filter(f => f.name.endsWith('.enc'));
      renderFiles();
    } catch (e) {
      showToast("Liste alınamadı!", true);
    }
  }

  function renderFiles() {
    fileList.innerHTML = '';
    if (_0xCUR.length === 0) {
      fileList.innerHTML = `<div style="color:var(--muted); grid-column: 1/-1; text-align: center;">Kasa boş.</div>`;
      return;
    }

    _0xCUR.forEach(file => {
      const origName = file.name.replace(/^\d+_/, '').replace(/\.enc$/, '');
      const card = document.createElement('div');
      card.className = 'file-card';
      let ext = origName.split('.').pop().toUpperCase();
      if (ext.length > 5) ext = 'FILE';

      card.innerHTML = `
        <div class="file-icon-badge">${ext}</div>
        <div class="file-name" title="${origName}">${origName}</div>
        <div class="file-size">Şifreli Veri</div>
        <div class="file-actions">
          <button onclick="previewFile('${file.name}', '${origName}')">Önizle</button>
          <button onclick="downloadFile('${file.name}', '${origName}')">İndir</button>
          <button class="btn-delete" onclick="deleteFile('${file.name}', '${file.sha}')">Sil</button>
        </div>
      `;
      fileList.appendChild(card);
    });
  }

  // ============================================
  // İNDİRME VE ÇÖZME (XOR + AES)
  // ============================================
  async function _0xGET_DATA(ghName) {
    const rawUrl = `https://raw.githubusercontent.com/${_0xU1}/${_0xR1}/main/${_0xF1}/${ghName}`;
    const res = await fetch(rawUrl);
    if (!res.ok) throw new Error("İndirilemedi");
    
    const b64 = await res.text();
    const combined = _0xU64(b64);
    
    const iv = new Uint8Array(combined.slice(0, 12));
    const ciphertext = combined.slice(12);
    
    // 1. AES Çöz
    const aesDecrypted = await _0xD1(ciphertext, iv, _0xMK);
    
    // 2. XOR Çöz
    const finalBuffer = _0xX0R(new Uint8Array(aesDecrypted), _0xX1);
    return finalBuffer.buffer;
  }

  window.downloadFile = async function(ghName, origName) {
    if (!_0xMK) return;
    try {
      showToast("Deşifre ediliyor...");
      const buf = await _0xGET_DATA(ghName);
      const blob = new Blob([buf]);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = origName;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast(`${origName} indirildi.`);
    } catch (e) {
      showToast("Şifre çözülemedi! Hatalı anahtar.", true);
    }
  };

  window.deleteFile = async function(ghName, sha) {
    if (!confirm('Dosya silinsin mi?')) return;
    try {
      await _0xGH_DEL(ghName, sha);
      showToast('Silindi.');
      await loadFiles();
    } catch (e) {
      showToast("Silinemedi: " + e.message, true);
    }
  };

  window.previewFile = async function(ghName, origName) {
    if (!_0xMK) return;
    document.getElementById('preview-title').innerText = origName;
    document.getElementById('preview-body').innerHTML = 'Deşifre ediliyor...';
    document.getElementById('preview-modal').classList.add('active');

    try {
      const buf = await _0xGET_DATA(ghName);
      const ext = origName.split('.').pop().toLowerCase();
      const isImage = ['jpg','jpeg','png','gif','webp','svg'].includes(ext);
      const isText = ['lua','py','js','html','css','json','txt','md','xml','sh','bat','c','cpp','h','java','php','rb','go','rs','cs','swift','kt','log','ini','cfg','yml','yaml'].includes(ext);
      
      const body = document.getElementById('preview-body');
      body.innerHTML = '';
      
      if (isImage) {
        const url = URL.createObjectURL(new Blob([buf]));
        const img = document.createElement('img'); img.src = url;
        body.appendChild(img);
      } else if (isText) {
        const text = new TextDecoder().decode(buf);
        const pre = document.createElement('pre'); pre.innerText = text;
        body.appendChild(pre);
      } else {
        body.innerHTML = `<div style="color:var(--muted)">Önizlenemeyen tür.</div>`;
      }
    } catch (e) {
      document.getElementById('preview-body').innerHTML = `<div style="color:red">Hatalı Anahtar!</div>`;
    }
  };

  window.closePreview = function() {
    document.getElementById('preview-modal').classList.remove('active');
  };
</script>
</body>
</html>
