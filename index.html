<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gelişmiş Arama Motoru — Buğrahan</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050508; --surface: rgba(15, 15, 22, 0.8); --border: rgba(255,255,255,0.08);
    --purple: #a855f7; --pink: #ec4899; --text: #fff; --muted: #888899;
    --green: #10b981;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
    min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 40px 20px;
    background-image: radial-gradient(circle at 50% 50%, rgba(168,85,247,0.05), transparent 50%);
  }
  .cursor { position: fixed; top:0; left:0; width:10px; height:10px; background:var(--purple); border-radius:50%; pointer-events:none; z-index:99999; transform:translate(-50%,-50%); box-shadow:0 0 10px var(--purple); }
  
  .container {
    width: 100%; max-width: 900px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 24px; backdrop-filter: blur(20px);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.8);
    display: flex; flex-direction: column; overflow: hidden;
  }
  
  .header {
    padding: 30px; text-align: center; border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.3);
  }
  .header h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2rem; background: linear-gradient(135deg, #fff, var(--purple)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .header p { color: var(--muted); font-size: 0.95rem; margin-top: 5px; }

  .search-panel { padding: 30px; }
  
  .search-box {
    display: flex; gap: 10px;
  }
  .search-box input { 
    flex: 1; padding: 20px 24px; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
    border-radius: 16px; color: #fff; font-family: 'Inter', sans-serif; font-size: 1.1rem; outline: none; transition: 0.3s;
  }
  .search-box input:focus { border-color: var(--purple); background: rgba(168,85,247,0.05); }
  
  .search-box button {
    padding: 0 40px; background: var(--purple); color: #fff; 
    border: none; border-radius: 16px; font-family: 'Space Grotesk', sans-serif; 
    font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s;
  }
  .search-box button:hover { background: var(--pink); transform: translateY(-2px); box-shadow: 0 10px 20px -10px rgba(236,72,153,0.5); }
  .search-box button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .results-area {
    padding: 0 30px 30px 30px; display: none;
  }
  .results-area.active { display: block; }

  .result-item {
    background: rgba(255,255,255,0.02); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; margin-bottom: 15px;
    transition: transform 0.2s, border-color 0.2s;
  }
  .result-item:hover {
    transform: translateY(-2px); border-color: rgba(168,85,247,0.4);
  }
  .result-item h3 { color: var(--purple); font-size: 1.2rem; margin-bottom: 10px; font-family: 'Space Grotesk', sans-serif; }
  .result-snippet { color: #ccc; font-size: 0.95rem; line-height: 1.6; margin-bottom: 15px; }
  .result-snippet mark { background: var(--purple); color: #fff; padding: 0 6px; border-radius: 4px; font-weight: bold; }
  
  .result-link {
    display: inline-block; color: var(--green); text-decoration: none; font-weight: 500; font-size: 0.9rem;
  }
  .result-link:hover { text-decoration: underline; }

  .status-msg { text-align: center; color: var(--muted); font-size: 1rem; padding: 40px 0; }

  @media (max-width: 600px) {
    .search-box { flex-direction: column; }
    .search-box button { padding: 18px; }
  }
</style>
</head>
<body>

  <div class="cursor" id="cursor"></div>

  <div class="container">
    <div class="header">
      <h1>Web Arama Botu</h1>
      <p>Anahtar kelimeni yaz, internetteki en güncel veriyi bul.</p>
    </div>

    <div class="search-panel">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Aramak istediğin kelimeyi yaz..." onkeypress="handleEnter(event)">
        <button id="searchBtn" onclick="startSearch()">Ara</button>
      </div>
    </div>

    <div class="results-area" id="resultsArea"></div>
  </div>

  <script>
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top = e.clientY + 'px';
    });

    const resultsArea = document.getElementById('resultsArea');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');

    async function startSearch() {
      const query = searchInput.value.trim();
      if (!query) return;

      resultsArea.classList.add('active');
      resultsArea.innerHTML = `<div class="status-msg">İnternette araştırılıyor... Lütfen bekle.</div>`;
      searchBtn.disabled = true;
      searchBtn.innerText = "Aranıyor...";

      try {
        // Wikipedia API'sini kullanıyoruz (CORS desteklidir, proxy gerektirmez)
        const wikiUrl = `https://tr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&utf8=1`;
        
        const response = await fetch(wikiUrl);
        const data = await response.json();

        resultsArea.innerHTML = ''; 

        if (data.query && data.query.search && data.query.search.length > 0) {
          // Arama sonuçlarını listele
          data.query.search.forEach(item => {
            // HTML etiketlerini temizle
            const cleanSnippet = item.snippet.replace(/<[^>]*>?/gm, '');
            
            // Anahtar kelimeyi vurgula (highlight)
            const regex = new RegExp(`(${query})`, "gi");
            const highlightedSnippet = cleanSnippet.replace(regex, '<mark>$1</mark>');

            const div = document.createElement('div');
            div.className = 'result-item';
            div.innerHTML = `
              <h3>${item.title}</h3>
              <div class="result-snippet">... ${highlightedSnippet} ...</div>
              <a href="https://tr.wikipedia.org/wiki/${encodeURIComponent(item.title)}" target="_blank" class="result-link">Wikipedia'da Oku →</a>
            `;
            resultsArea.appendChild(div);
          });
        } else {
          resultsArea.innerHTML = `<div class="status-msg">"${query}" için sonuç bulunamadı. Farklı bir kelime dene.</div>`;
        }

      } catch (error) {
        resultsArea.innerHTML = `<div class="status-msg" style="color:var(--pink);">Bağlantı hatası oluştu. Lütfen tekrar dene.</div>`;
        console.error(error);
      } finally {
        searchBtn.disabled = false;
        searchBtn.innerText = "Ara";
      }
    }

    function handleEnter(e) {
      if (e.key === 'Enter') startSearch();
    }
  </script>

</body>
</html>
